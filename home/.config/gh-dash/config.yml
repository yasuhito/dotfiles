prSections:
    - title: Current Repo PRs
      filters: is:open
    - title: Current Repo Mine
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: Current Repo Issues
      filters: is:open
    - title: Current Repo Assigned
      filters: is:open assignee:@me
    - title: Current Repo Created
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: My Issues
      filters: is:open author:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 50
    notificationsLimit: 20
    view: issues
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 24
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                hidden: true
            reactions:
                hidden: true
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    universal:
        - key: pgdown
          builtin: pageDown
        - key: pgup
          builtin: pageUp
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: true
    colors:
        text:
            primary: "#100F0F"
            secondary: "#6F6E69"
            inverted: "#FFFCF0"
            faint: "#B7B5AC"
            warning: "#AF3029"
            success: "#66800B"
            actor: "#575653"
        background:
            selected: "#E6E4D9"
        border:
            primary: "#CECDC3"
            secondary: "#DAD8CE"
            faint: "#F2F0E5"
        inline:
            icons:
                newcontributor: "#66800B"
                contributor: "#205EA6"
                collaborator: "#24837B"
                member: "#AD8301"
                owner: "#5E409D"
                unknownrole: "#6F6E69"
    icons:
        inline:
            newcontributor: "󰎔"
            contributor: ""
            collaborator: ""
            member: ""
            owner: ""
            unknownrole: "󰭙"
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
