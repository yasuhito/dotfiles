name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run installer tests
        run: ./tests/install.test.sh
      - name: Run ShellCheck
        run: >-
          shellcheck install.sh tests/install.test.sh
          tests/fixtures/xdg-terminal-exec
          home/.local/bin/wezterm-xdg-terminal-exec
